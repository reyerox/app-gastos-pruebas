<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenGastos Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#09090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            base: 'var(--color-base)',
            surface: 'var(--color-surface)',
            card: 'var(--color-card)',
            raised: 'var(--color-raised)',
            border: 'var(--color-border)',
            dim: 'var(--color-dim)',
            income: 'var(--color-income)',
            spend: 'var(--color-spend)',
            accent: 'var(--color-accent)',
            gold: 'var(--color-gold)',
          }
        }
      }
    }
  </script>
  
  <style>
    :root {
      --color-base: #09090d;
      --color-surface: #121218;
      --color-card: rgba(255,255,255,0.04);
      --color-raised: rgba(255,255,255,0.08);
      --color-border: rgba(255,255,255,0.08);
      --color-dim: #71717a;
      --color-income: #34d399;
      --color-spend: #f87171;
      --color-accent: #818cf8;
      --color-gold: #fbbf24;
      --text-main: #ffffff;
    }
    
    [data-theme="love"] {
      --color-base: #fff0f5;
      --color-surface: #ffe4ef;
      --color-card: rgba(193,18,31,0.06);
      --color-raised: rgba(193,18,31,0.1);
      --color-border: rgba(193,18,31,0.15);
      --color-dim: #9e6c80;
      --color-income: #2a9d8f;
      --color-spend: #c1121f;
      --color-accent: #7c3aed;
      --color-gold: #d97706;
      --text-main: #4a0e4e;
    }

    body {
      margin: 0;
      background-color: var(--color-base);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .glass-card {
      background: var(--color-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      transition: all 0.2s ease-in-out;
    }

    .glass-card:not(.bg-surface):hover {
      background: var(--color-raised);
    }
    
    .glass-input {
      background: rgba(0,0,0,0.1);
      border: 1px solid var(--color-border);
      color: var(--text-main);
    }
    [data-theme="love"] .glass-input {
      background: rgba(255,255,255,0.5);
    }

    .modal-overlay {
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .animate-slide-up {
      animation: slideUp 0.3s ease-out forwards;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }
    
    @media (max-width: 640px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;

    // --- Constants ---
    const USERS = ['Dani 🦭', 'Nati 🌻'];
    const CATEGORIES = ['Obligatorios', 'Opcionales', 'Ocio', 'Inversiones', 'Otros'];
    const CATEGORY_ICONS = {
      'Obligatorios': '🏠',
      'Opcionales': '🛍️',
      'Ocio': '🎮',
      'Inversiones': '📈',
      'Otros': '📦'
    };

    // --- Helpers ---
    const fmt = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n || 0);
    const fmtDate = (dateStr) => {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}`;
    };
    const monthName = (date) => {
      const name = date.toLocaleString('es-ES', { month: 'long' });
      return name.charAt(0).toUpperCase() + name.slice(1) + ' ' + date.getFullYear();
    };
    const pct = (a, b) => b === 0 ? '0.0' : ((a / b) * 100).toFixed(1);
    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    const momTag = (curr, prev, invertColor = false) => {
      if (!prev || prev === 0) return null;
      const diff = ((curr - prev) / prev) * 100;
      if (diff === 0) return null;
      const isIncrease = diff > 0;
      const isGood = invertColor ? !isIncrease : isIncrease;
      const colorClass = isGood ? 'text-income bg-income/10' : 'text-spend bg-spend/10';
      const arrow = isIncrease ? '↑' : '↓';
      return (
        <span className={`text-xs px-1.5 py-0.5 rounded-full ${colorClass} ml-2 font-medium`}>
          {arrow} {Math.abs(diff).toFixed(1)}%
        </span>
      );
    };

    // --- Error Boundary ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="glass-card p-6 max-w-md text-center">
                <h2 className="text-xl font-bold text-spend mb-2">¡Ups! Algo salió mal</h2>
                <p className="text-sm opacity-80 mb-4">{this.state.error?.message}</p>
                <button 
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 bg-accent text-white rounded-lg hover:opacity-90"
                >
                  Recargar App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- Components ---

    const UserSelection = ({ onSelect }) => (
      <div className="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-base">
        <h1 className="font-display text-4xl mb-8 text-center animate-slide-up" style={{animationDelay: '0.1s'}}>
          ¿Quién eres?
        </h1>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
          {USERS.map((user, i) => {
            const isDani = user.includes('Dani');
            return (
              <button
                key={user}
                onClick={() => onSelect(user)}
                className={`glass-card p-8 flex flex-col items-center justify-center gap-4 transition-transform hover:scale-105 animate-slide-up hover:border-accent`}
                style={{animationDelay: `${0.2 + i * 0.1}s`}}
              >
                <span className="text-6xl">{isDani ? '🦭' : '🌻'}</span>
                <span className="text-2xl font-semibold">{user.split(' ')[0]}</span>
              </button>
            )
          })}
        </div>
      </div>
    );

    const TransactionModal = ({ tx, currentUser, onClose, onSave, onDelete }) => {
      const [type, setType] = useState(tx?.type || 'expense');
      const [date, setDate] = useState(tx?.date || new Date().toISOString().split('T')[0]);
      const [concept, setConcept] = useState(tx?.concept || '');
      const [amount, setAmount] = useState(tx?.amount || '');
      const [tipo, setTipo] = useState(tx?.tipo || CATEGORIES[0]);
      const [customTipo, setCustomTipo] = useState(tx?.customTipo || '');
      const [scope, setScope] = useState(tx?.scope || 'Personal');
      const [paidBy, setPaidBy] = useState(tx?.paidBy || currentUser);

      useEffect(() => {
        if (scope === 'Personal') setPaidBy(currentUser);
      }, [scope, currentUser]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const numAmount = parseFloat(amount);
        if (!concept || isNaN(numAmount) || numAmount <= 0) return;
        
        onSave({
          id: tx?.id || generateId(),
          type,
          date,
          concept,
          amount: numAmount,
          tipo,
          customTipo: tipo === 'Otros' ? customTipo : '',
          scope,
          paidBy
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
          <div className="glass-card w-full max-w-lg p-4 sm:p-6 animate-slide-up bg-surface max-h-[90vh] overflow-y-auto">
            <h2 className="text-xl font-display font-semibold mb-4">
              {tx?.id ? 'Editar Transacción' : 'Nueva Transacción'}
            </h2>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Type Toggle */}
              <div className="flex bg-black/20 p-1 rounded-lg">
                <button
                  type="button"
                  onClick={() => setType('expense')}
                  className={`flex-1 py-1.5 rounded-md text-sm font-medium transition-colors ${type === 'expense' ? 'bg-spend text-white' : 'opacity-60 hover:opacity-100'}`}
                >
                  Gasto
                </button>
                <button
                  type="button"
                  onClick={() => setType('income')}
                  className={`flex-1 py-1.5 rounded-md text-sm font-medium transition-colors ${type === 'income' ? 'bg-income text-white' : 'opacity-60 hover:opacity-100'}`}
                >
                  Ingreso
                </button>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs opacity-70 mb-1">Fecha</label>
                  <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full glass-input px-3 py-2 rounded-lg text-sm" />
                </div>
                <div>
                  <label className="block text-xs opacity-70 mb-1">Importe (€)</label>
                  <input type="number" step="0.01" min="0.01" value={amount} onChange={e => setAmount(e.target.value)} required className="w-full glass-input px-3 py-2 rounded-lg text-sm" placeholder="0.00" />
                </div>
              </div>

              <div>
                <label className="block text-xs opacity-70 mb-1">Concepto</label>
                <input type="text" value={concept} onChange={e => setConcept(e.target.value)} required className="w-full glass-input px-3 py-2 rounded-lg text-sm" placeholder="Ej. Compra supermercado" />
              </div>

              {type === 'expense' && (
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs opacity-70 mb-1">Categoría</label>
                    <select value={tipo} onChange={e => setTipo(e.target.value)} className="w-full glass-input px-3 py-2 rounded-lg text-sm">
                      {CATEGORIES.map(c => <option key={c} value={c} className="bg-surface text-white">{CATEGORY_ICONS[c]} {c}</option>)}
                    </select>
                  </div>
                  {tipo === 'Otros' && (
                    <div>
                      <label className="block text-xs opacity-70 mb-1">Especificar</label>
                      <input type="text" value={customTipo} onChange={e => setCustomTipo(e.target.value)} required className="w-full glass-input px-3 py-2 rounded-lg text-sm" />
                    </div>
                  )}
                </div>
              )}

              {/* Scope & PaidBy */}
              <div className="grid grid-cols-2 gap-4 border-t border-border pt-4 mt-2">
                <div>
                  <label className="block text-xs opacity-70 mb-1">Tipo de Gasto</label>
                  <div className="flex bg-black/20 p-1 rounded-lg">
                    <button type="button" onClick={() => setScope('Personal')} className={`flex-1 py-1 rounded-md text-xs font-medium transition-colors ${scope === 'Personal' ? 'bg-accent text-white' : 'opacity-60'}`}>👤 Personal</button>
                    <button type="button" onClick={() => setScope('Común')} className={`flex-1 py-1 rounded-md text-xs font-medium transition-colors ${scope === 'Común' ? 'bg-accent text-white' : 'opacity-60'}`}>🏠 Común</button>
                  </div>
                </div>
                <div>
                  <label className="block text-xs opacity-70 mb-1">Pagado por</label>
                  <select value={paidBy} onChange={e => setPaidBy(e.target.value)} disabled={scope === 'Personal'} className={`w-full glass-input px-3 py-2 rounded-lg text-sm ${scope === 'Personal' ? 'opacity-50 cursor-not-allowed' : ''}`}>
                    {USERS.map(u => <option key={u} value={u} className="bg-surface text-white">{u}</option>)}
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-3 pt-4 border-t border-border mt-4">
                {tx?.id && (
                  <button type="button" onClick={() => onDelete(tx.id)} className="mr-auto px-4 py-2 text-spend hover:bg-spend/10 rounded-lg text-sm transition-colors">
                    Eliminar
                  </button>
                )}
                <button type="button" onClick={onClose} className="px-4 py-2 hover:bg-white/5 rounded-lg text-sm transition-colors">
                  Cancelar
                </button>
                <button type="submit" className="px-6 py-2 bg-accent hover:opacity-90 text-white rounded-lg text-sm font-medium transition-opacity">
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    const BudgetModal = ({ currentBudget, onClose, onSave }) => {
      const [val, setVal] = useState(currentBudget || '');
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
          <div className="glass-card w-full max-w-sm p-4 sm:p-6 bg-surface max-h-[90vh] overflow-y-auto">
            <h2 className="text-lg font-semibold mb-4">Presupuesto Mensual</h2>
            <input type="number" step="1" min="0" value={val} onChange={e=>setVal(e.target.value)} className="w-full glass-input px-3 py-2 rounded-lg mb-4" placeholder="Ej. 1500" />
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 text-sm rounded-lg hover:bg-white/5">Cancelar</button>
              <button onClick={() => onSave(Number(val))} className="px-3 py-1.5 text-sm bg-accent text-white rounded-lg">Guardar</button>
            </div>
          </div>
        </div>
      );
    };

    const GoalModal = ({ goal, onClose, onSave, onDelete }) => {
      const [name, setName] = useState(goal?.name || '');
      const [target, setTarget] = useState(goal?.target || '');
      const [saved, setSaved] = useState(goal?.saved || 0);
      const [autoSweep, setAutoSweep] = useState(goal?.autoSweep || false);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
          <div className="glass-card w-full max-w-sm p-4 sm:p-6 bg-surface max-h-[90vh] overflow-y-auto">
            <h2 className="text-lg font-semibold mb-4">{goal ? 'Editar Meta' : 'Nueva Meta'}</h2>
            <div className="space-y-3">
              <div>
                <label className="block text-xs opacity-70 mb-1">Nombre</label>
                <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full glass-input px-3 py-2 rounded-lg" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs opacity-70 mb-1">Objetivo (€)</label>
                  <input type="number" value={target} onChange={e=>setTarget(e.target.value)} className="w-full glass-input px-3 py-2 rounded-lg" />
                </div>
                <div>
                  <label className="block text-xs opacity-70 mb-1">Ahorrado (€)</label>
                  <input type="number" value={saved} onChange={e=>setSaved(e.target.value)} className="w-full glass-input px-3 py-2 rounded-lg" />
                </div>
              </div>
              <label className="flex items-center gap-2 mt-2 cursor-pointer">
                <input type="checkbox" checked={autoSweep} onChange={e=>setAutoSweep(e.target.checked)} className="rounded" />
                <span className="text-sm">Auto Barrido (suma el sobrante global)</span>
              </label>
            </div>
            <div className="flex justify-end gap-2 mt-6">
              {goal && <button onClick={() => onDelete(goal.id)} className="mr-auto text-spend text-sm hover:underline">Eliminar</button>}
              <button onClick={onClose} className="px-3 py-1.5 text-sm rounded-lg hover:bg-white/5">Cancelar</button>
              <button onClick={() => {
                if(!name || !target) return;
                onSave({ id: goal?.id || generateId(), name, target: Number(target), saved: Number(saved), autoSweep });
              }} className="px-3 py-1.5 text-sm bg-accent text-white rounded-lg">Guardar</button>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      // --- State ---
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('zg_current_user'));
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('zg_transactions')) || []);
      const [budget, setBudget] = useState(() => Number(localStorage.getItem('zg_global_budget')) || 0);
      const [goals, setGoals] = useState(() => JSON.parse(localStorage.getItem('zg_goals')) || []);
      const [theme, setTheme] = useState(() => localStorage.getItem('zg_theme') || 'dark');
      
      const [viewMonth, setViewMonth] = useState(() => new Date());
      const [filter, setFilter] = useState('all'); // all, expense, income
      
      // Modals
      const [editingTx, setEditingTx] = useState(null);
      const [showTxModal, setShowTxModal] = useState(false);
      const [showBudgetModal, setShowBudgetModal] = useState(false);
      const [editingGoal, setEditingGoal] = useState(null);
      const [showGoalModal, setShowGoalModal] = useState(false);

      // --- Effects ---
      useEffect(() => {
        if (currentUser) localStorage.setItem('zg_current_user', currentUser);
      }, [currentUser]);
      useEffect(() => {
        localStorage.setItem('zg_transactions', JSON.stringify(transactions));
      }, [transactions]);
      useEffect(() => {
        localStorage.setItem('zg_global_budget', budget);
      }, [budget]);
      useEffect(() => {
        localStorage.setItem('zg_goals', JSON.stringify(goals));
      }, [goals]);
      useEffect(() => {
        localStorage.setItem('zg_theme', theme);
        if (theme === 'love') document.documentElement.setAttribute('data-theme', 'love');
        else document.documentElement.removeAttribute('data-theme');
      }, [theme]);

      // --- Computed Data ---
      const viewY = viewMonth.getFullYear();
      const viewM = viewMonth.getMonth();
      
      const prevDate = new Date(viewY, viewM - 1, 1);
      const prevY = prevDate.getFullYear();
      const prevM = prevDate.getMonth();

      const getMonthTxs = (y, m) => transactions.filter(t => {
        const d = new Date(t.date);
        return d.getFullYear() === y && d.getMonth() === m;
      });

      const monthTx = useMemo(() => getMonthTxs(viewY, viewM), [transactions, viewY, viewM]);
      const prevMonthTx = useMemo(() => getMonthTxs(prevY, prevM), [transactions, prevY, prevM]);

      const calculateTotals = (txs) => {
        let income = 0, expense = 0;
        txs.forEach(t => {
          if (t.type === 'income') income += t.amount;
          else expense += t.amount;
        });
        return { income, expense, balance: income - expense };
      };

      const curTotals = useMemo(() => calculateTotals(monthTx), [monthTx]);
      const prevTotals = useMemo(() => calculateTotals(prevMonthTx), [prevMonthTx]);

      const filteredTx = useMemo(() => {
        let res = [...monthTx].sort((a,b) => new Date(b.date) - new Date(a.date));
        if (filter !== 'all') res = res.filter(t => t.type === filter);
        return res;
      }, [monthTx, filter]);

      const categoryBreakdown = useMemo(() => {
        const catTotals = {};
        CATEGORIES.forEach(c => catTotals[c] = 0);
        monthTx.filter(t => t.type === 'expense').forEach(t => {
          if(catTotals[t.tipo] !== undefined) catTotals[t.tipo] += t.amount;
        });
        return catTotals;
      }, [monthTx]);

      const globalBalance = useMemo(() => {
        return calculateTotals(transactions).balance;
      }, [transactions]);

      // --- Actions ---
      const toggleTheme = () => setTheme(t => t === 'dark' ? 'love' : 'dark');
      const changeMonth = (delta) => setViewMonth(new Date(viewY, viewM + delta, 1));
      
      const handleSaveTx = (tx) => {
        const existing = transactions.findIndex(t => t.id === tx.id);
        if (existing >= 0) {
          const newTxs = [...transactions];
          newTxs[existing] = tx;
          setTransactions(newTxs);
        } else {
          setTransactions([...transactions, tx]);
        }
        setShowTxModal(false);
        setEditingTx(null);
      };

      const handleDeleteTx = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
        setShowTxModal(false);
        setEditingTx(null);
      };

      const exportCSV = () => {
        if(monthTx.length === 0) return alert('No hay transacciones este mes');
        const headers = 'ID,Fecha,Tipo,Concepto,Importe,Categoria,Detalle,Alcance,PagadoPor\n';
        const rows = monthTx.map(t => `${t.id},${t.date},${t.type},"${t.concept}",${t.amount},${t.tipo || ''},"${t.customTipo || ''}",${t.scope},${t.paidBy}`).join('\n');
        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `ZenGastos_${viewY}_${viewM+1}.csv`;
        link.click();
      };

      const importRef = useRef(null);
      const importCSV = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split('\n').slice(1); // skip header
          const newTxs = [];
          lines.forEach(l => {
            if(!l.trim()) return;
            // Basic CSV parsing (doesn't handle commas in quotes perfectly if complex, but good enough for simple app)
            const match = l.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if(!match || match.length < 9) return;
            const clean = s => s ? s.replace(/^"|"$/g, '') : '';
            newTxs.push({
              id: clean(match[0]),
              date: clean(match[1]),
              type: clean(match[2]),
              concept: clean(match[3]),
              amount: parseFloat(clean(match[4])),
              tipo: clean(match[5]),
              customTipo: clean(match[6]),
              scope: clean(match[7]),
              paidBy: clean(match[8])
            });
          });
          if(newTxs.length) {
            // merge by ID
            const existingIds = new Set(transactions.map(t=>t.id));
            const toAdd = newTxs.filter(t => !existingIds.has(t.id));
            if(toAdd.length) {
              setTransactions([...transactions, ...toAdd]);
              alert(`${toAdd.length} transacciones importadas.`);
            } else {
              alert('No se encontraron transacciones nuevas para importar.');
            }
          }
        };
        reader.readAsText(file);
        e.target.value = null; // reset
      };

      if (!currentUser) {
        return <UserSelection onSelect={setCurrentUser} />;
      }

      return (
        <div className="min-h-screen pb-20 lg:pb-6">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-base/80 backdrop-blur-md border-b border-border">
            <div className="max-w-7xl mx-auto px-2 sm:px-4 min-h-[4rem] py-2 sm:py-0 grid grid-cols-2 sm:flex sm:items-center sm:justify-between gap-y-2 w-full">
              <div className="flex items-center gap-1 sm:gap-2 justify-start">
                <span className="text-xl sm:text-2xl">☯️</span>
                <h1 className="font-display font-bold text-sm sm:text-lg">ZenGastos Pro</h1>
              </div>
              
              <div className="flex items-center gap-1 sm:gap-3 justify-center col-span-2 order-last sm:order-none w-full sm:w-auto">
                <button onClick={() => changeMonth(-1)} className="p-1.5 sm:p-2 hover:bg-white/10 rounded-full">◀</button>
                <span className="font-medium text-center capitalize">{monthName(viewMonth)}</span>
                <button onClick={() => changeMonth(1)} className="p-1.5 sm:p-2 hover:bg-white/10 rounded-full">▶</button>
              </div>

              <div className="flex items-center gap-1 sm:gap-3 justify-end">
                <div className="flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-1 sm:py-1.5 glass-card">
                  <span className="hidden sm:inline">{currentUser.split(' ')[0]}</span>
                  <span className="sm:hidden">{currentUser.includes('Dani') ? '🦭' : '🌻'}</span>
                  <button onClick={() => {if(confirm('¿Cambiar usuario?')) setCurrentUser(null)}} className="text-xs opacity-70 hover:opacity-100 underline">Cambiar</button>
                </div>
                <button onClick={toggleTheme} className="p-1.5 sm:p-2 glass-card hover:scale-105 text-sm sm:text-base" title="Cambiar Tema">
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
                <div className="relative group">
                  <button className="p-1.5 sm:p-2 glass-card hover:scale-105 text-sm sm:text-base" title="Opciones CSV">📁</button>
                  <div className="absolute right-0 top-full mt-2 w-48 glass-card p-2 hidden group-hover:block group-focus-within:block bg-surface z-50">
                    <button onClick={exportCSV} className="w-full text-left px-3 py-2 text-sm hover:bg-white/10 rounded">Exportar Mes (CSV)</button>
                    <label className="block w-full text-left px-3 py-2 text-sm hover:bg-white/10 rounded cursor-pointer">
                      Importar (CSV)
                      <input type="file" accept=".csv" onChange={importCSV} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
            
            {/* Summary Cards */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="glass-card p-4">
                <h3 className="text-sm opacity-70 mb-1">Gastos</h3>
                <div className="text-2xl font-bold text-spend">{fmt(curTotals.expense)}</div>
                <div className="mt-2">{momTag(curTotals.expense, prevTotals.expense, true)}</div>
              </div>
              <div className="glass-card p-4">
                <h3 className="text-sm opacity-70 mb-1">Ingresos</h3>
                <div className="text-2xl font-bold text-income">{fmt(curTotals.income)}</div>
                <div className="mt-2">{momTag(curTotals.income, prevTotals.income)}</div>
              </div>
              <div className="glass-card p-4">
                <h3 className="text-sm opacity-70 mb-1">Balance</h3>
                <div className={`text-2xl font-bold ${curTotals.balance >= 0 ? 'text-income' : 'text-spend'}`}>
                  {curTotals.balance > 0 ? '+' : ''}{fmt(curTotals.balance)}
                </div>
              </div>
              <div className="glass-card p-4 flex flex-col justify-between">
                <div>
                  <h3 className="text-sm opacity-70 mb-1">Presupuesto (Gastos)</h3>
                  <div className="text-lg font-bold">{budget > 0 ? pct(curTotals.expense, budget) + '%' : 'No def.'}</div>
                </div>
                {budget > 0 && (
                  <div className="w-full bg-black/20 h-2 mt-2 rounded-full overflow-hidden">
                    <div className={`h-full ${curTotals.expense/budget > 0.8 ? 'bg-spend' : 'bg-income'}`} style={{width: `${Math.min(100, (curTotals.expense/budget)*100)}%`}}></div>
                  </div>
                )}
              </div>
            </div>

            {/* Category Cards (Small) */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              {CATEGORIES.map(c => {
                const amount = categoryBreakdown[c];
                const p = pct(amount, curTotals.expense);
                return (
                  <div key={c} className="glass-card p-3 flex items-center gap-3">
                    <div className="text-2xl">{CATEGORY_ICONS[c]}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-xs opacity-70 truncate">{c}</div>
                      <div className="font-semibold text-sm truncate">{fmt(amount)}</div>
                      <div className="w-full bg-black/20 h-1 mt-1 rounded-full overflow-hidden">
                        <div className="bg-accent h-full" style={{width: `${p}%`}}></div>
                      </div>
                    </div>
                  </div>
                )
              })}
            </div>

            {/* Main Layout Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
              
              {/* Left Column: Transactions */}
              <div className="lg:col-span-3 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div className="flex glass-card p-1">
                    {['all', 'expense', 'income'].map(f => (
                      <button key={f} onClick={() => setFilter(f)} className={`px-4 py-1.5 text-sm rounded-lg capitalize transition-colors ${filter === f ? 'bg-accent text-white' : 'opacity-70 hover:opacity-100'}`}>
                        {f === 'all' ? 'Todo' : f === 'expense' ? 'Gastos' : 'Ingresos'}
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => {setEditingTx({type:'expense'}); setShowTxModal(true)}} className="px-4 py-2 bg-spend/20 text-spend hover:bg-spend/30 rounded-lg text-sm font-semibold transition-colors border border-spend/30">
                      + Gasto
                    </button>
                    <button onClick={() => {setEditingTx({type:'income'}); setShowTxModal(true)}} className="px-4 py-2 bg-income/20 text-income hover:bg-income/30 rounded-lg text-sm font-semibold transition-colors border border-income/30">
                      + Ingreso
                    </button>
                  </div>
                </div>

                <div className="glass-card overflow-hidden">
                  {filteredTx.length === 0 ? (
                    <div className="p-8 text-center opacity-60">
                      <p>No hay transacciones este mes.</p>
                      <p className="text-sm mt-2">¡Empieza añadiendo una arriba!</p>
                    </div>
                  ) : (
                    <div className="divide-y divide-border max-h-[600px] overflow-y-auto">
                      {filteredTx.map(t => (
                        <div key={t.id} className="p-3 hover:bg-white/5 flex items-center justify-between group transition-colors">
                          <div className="flex items-center gap-3 overflow-hidden">
                            <div className="w-10 h-10 rounded-full bg-black/20 flex items-center justify-center text-lg shrink-0">
                              {t.type === 'expense' ? CATEGORY_ICONS[t.tipo] || '💸' : '💰'}
                            </div>
                            <div className="min-w-0">
                              <div className="font-medium truncate">{t.concept} {t.customTipo ? `(${t.customTipo})` : ''}</div>
                              <div className="text-xs opacity-60 flex flex-wrap items-center gap-x-2 gap-y-1 mt-0.5">
                                <span>{fmtDate(t.date)}</span> • 
                                <span>{t.paidBy}</span>
                                <span className="px-1.5 py-0.5 bg-black/20 rounded text-[10px]">{t.scope === 'Común' ? '🏠 Común' : '👤 Personal'}</span>
                                {t.type === 'expense' && <span className="px-1.5 py-0.5 bg-black/20 rounded text-[10px]">{t.tipo}</span>}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-3 shrink-0 ml-2">
                            <span className={`font-semibold ${t.type === 'income' ? 'text-income' : 'text-spend'}`}>
                              {t.type === 'income' ? '+' : '-'}{fmt(t.amount)}
                            </span>
                            <div className="flex items-center gap-1 opacity-60 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                              <button onClick={() => {setEditingTx(t); setShowTxModal(true)}} className="p-1.5 hover:bg-accent/20 rounded text-accent" title="Editar">✏️</button>
                              <button onClick={() => handleDeleteTx(t.id)} className="p-1.5 hover:bg-spend/20 rounded text-spend" title="Eliminar">🗑️</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* Right Column: Widgets */}
              <div className="lg:col-span-2 space-y-4">
                
                {/* Month Analysis */}
                <div className="glass-card p-5">
                  <h3 className="font-display font-semibold mb-3">Análisis del Mes</h3>
                  <div className="flex items-center gap-4">
                    <div className="text-4xl">
                      {curTotals.balance >= 0 ? '✨' : '⚠️'}
                    </div>
                    <div>
                      {curTotals.balance >= 0 ? (
                        <>
                          <div className="text-income font-bold text-lg">Sobrante: +{fmt(curTotals.balance)}</div>
                          <div className="text-xs opacity-70 mt-1">¡Genial! Considera enviarlo a una meta de ahorro.</div>
                        </>
                      ) : (
                        <>
                          <div className="text-spend font-bold text-lg">Déficit: {fmt(curTotals.balance)}</div>
                          <div className="text-xs opacity-70 mt-1">Has gastado más de lo ingresado este mes.</div>
                        </>
                      )}
                    </div>
                  </div>
                </div>

                {/* Settlement (Cuentas Claras) */}
                <div className="glass-card p-5">
                  <h3 className="font-display font-semibold mb-3 flex items-center justify-between">
                    Cuentas Claras ⚖️
                    <span className="text-xs opacity-60 font-normal">Gastos Comunes</span>
                  </h3>
                  {(() => {
                    const comunTx = monthTx.filter(t => t.scope === 'Común' && t.type === 'expense');
                    let daniPaid = 0, natiPaid = 0;
                    comunTx.forEach(t => {
                      if (t.paidBy.includes('Dani')) daniPaid += t.amount;
                      if (t.paidBy.includes('Nati')) natiPaid += t.amount;
                    });
                    const total = daniPaid + natiPaid;
                    const half = total / 2;
                    const daniDiff = daniPaid - half;
                    
                    return (
                      <div>
                        <div className="flex justify-between text-sm mb-3">
                          <div><span className="opacity-70">Dani pagó:</span> <span className="font-semibold">{fmt(daniPaid)}</span></div>
                          <div><span className="opacity-70">Nati pagó:</span> <span className="font-semibold">{fmt(natiPaid)}</span></div>
                        </div>
                        <div className="p-3 bg-black/10 rounded-lg text-center border border-border">
                          {total === 0 ? (
                            <span className="opacity-70 text-sm">No hay gastos comunes este mes.</span>
                          ) : Math.abs(daniDiff) < 0.01 ? (
                            <span className="text-income font-medium">¡Estáis en paz! 🤝</span>
                          ) : daniDiff > 0 ? (
                            <span className="text-gold font-medium">Nati debe a Dani {fmt(daniDiff)}</span>
                          ) : (
                            <span className="text-accent font-medium">Dani debe a Nati {fmt(Math.abs(daniDiff))}</span>
                          )}
                        </div>
                      </div>
                    );
                  })()}
                </div>

                {/* Bar Chart */}
                <div className="glass-card p-5">
                  <h3 className="font-display font-semibold mb-4">Flujo</h3>
                  {(() => {
                    const max = Math.max(curTotals.income, curTotals.expense, 1); // avoid /0
                    const hInc = (curTotals.income / max) * 100;
                    const hExp = (curTotals.expense / max) * 100;
                    return (
                      <div className="flex items-end justify-center gap-8 h-40 pt-4">
                        <div className="flex flex-col items-center gap-2 w-24 h-full">
                          <div className="w-full flex-1 flex items-end">
                            <div className="w-full bg-income opacity-80 rounded-t-md transition-all duration-500" style={{height: `${hInc}%`}}></div>
                          </div>
                          <div className="text-center">
                            <div className="text-xs font-semibold text-income">{fmt(curTotals.income)}</div>
                            <div className="text-[10px] opacity-70 uppercase tracking-wide">Ingresos</div>
                          </div>
                        </div>
                        <div className="flex flex-col items-center gap-2 w-24 h-full">
                          <div className="w-full flex-1 flex items-end">
                            <div className="w-full bg-spend opacity-80 rounded-t-md transition-all duration-500" style={{height: `${hExp}%`}}></div>
                          </div>
                          <div className="text-center">
                            <div className="text-xs font-semibold text-spend">{fmt(curTotals.expense)}</div>
                            <div className="text-[10px] opacity-70 uppercase tracking-wide">Gastos</div>
                          </div>
                        </div>
                      </div>
                    )
                  })()}
                </div>

                {/* Budget Widget */}
                <div className="glass-card p-5">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="font-display font-semibold">Presupuesto Mensual</h3>
                    <button onClick={() => setShowBudgetModal(true)} className="text-xs text-accent hover:underline">Editar límite</button>
                  </div>
                  {budget === 0 ? (
                    <div className="text-sm opacity-70">No hay un límite definido. Haz clic en "Editar límite" para configurarlo.</div>
                  ) : (
                    <div>
                      <div className="flex justify-between text-sm mb-1">
                        <span>Gastado: {fmt(curTotals.expense)}</span>
                        <span>Límite: {fmt(budget)}</span>
                      </div>
                      <div className="w-full h-3 bg-black/20 rounded-full overflow-hidden">
                        <div 
                          className={`h-full transition-all duration-500 ${curTotals.expense > budget ? 'bg-spend' : curTotals.expense > budget*0.8 ? 'bg-gold' : 'bg-income'}`}
                          style={{width: `${Math.min(100, (curTotals.expense/budget)*100)}%`}}
                        ></div>
                      </div>
                      <div className="text-right text-xs mt-1 opacity-70">{pct(curTotals.expense, budget)}%</div>
                    </div>
                  )}
                </div>

                {/* Categories Breakdown Widget */}
                <div className="glass-card p-5">
                  <h3 className="font-display font-semibold mb-4">Desglose por Categoría 📊</h3>
                  {curTotals.expense === 0 ? (
                    <div className="text-sm opacity-60 text-center py-2">Sin gastos este mes.</div>
                  ) : (
                    <div className="space-y-3">
                      {CATEGORIES.map(c => {
                        const amount = categoryBreakdown[c];
                        const p = pct(amount, curTotals.expense);
                        if (amount === 0) return null;
                        return (
                          <div key={c}>
                            <div className="flex items-center justify-between text-sm mb-1">
                              <span className="flex items-center gap-2">
                                <span>{CATEGORY_ICONS[c]}</span>
                                <span>{c}</span>
                              </span>
                              <span className="font-semibold">{fmt(amount)} <span className="text-xs opacity-60">({p}%)</span></span>
                            </div>
                            <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden">
                              <div className="h-full bg-accent/70 transition-all duration-500" style={{width: `${p}%`}}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                {/* Goals Widget */}
                <div className="glass-card p-5">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-display font-semibold flex items-center gap-2">Metas de Ahorro 🎯</h3>
                    <button onClick={() => {setEditingGoal(null); setShowGoalModal(true)}} className="px-2 py-1 text-xs bg-accent/20 text-accent rounded hover:bg-accent/30">+ Nueva</button>
                  </div>
                  
                  {goals.length === 0 ? (
                    <div className="text-sm opacity-60 text-center py-2">No hay metas configuradas.</div>
                  ) : (
                    <div className="space-y-4">
                      {goals.map(g => {
                        const effectiveSaved = g.autoSweep ? (g.saved + globalBalance) : g.saved;
                        const p = pct(Math.max(0, effectiveSaved), g.target);
                        return (
                          <div key={g.id} className="p-3 bg-black/10 border border-border rounded-lg group">
                            <div className="flex justify-between items-start mb-1">
                              <div className="font-medium text-sm flex items-center gap-2">
                                {g.name}
                                {g.autoSweep && <span className="text-[10px] px-1.5 py-0.5 bg-accent/20 text-accent rounded-full">Auto 🧹</span>}
                              </div>
                              <button onClick={() => {setEditingGoal(g); setShowGoalModal(true)}} className="opacity-0 group-hover:opacity-100 text-xs text-accent transition-opacity">Editar</button>
                            </div>
                            <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden mb-1">
                              <div className="h-full bg-accent transition-all duration-500" style={{width: `${Math.min(100, p)}%`}}></div>
                            </div>
                            <div className="flex justify-between text-xs opacity-70">
                              <span>{fmt(effectiveSaved)}</span>
                              <span>{fmt(g.target)} ({p}%)</span>
                            </div>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>

              </div>
            </div>
          </main>

          {/* Modals */}
          {showTxModal && (
            <TransactionModal 
              tx={editingTx} 
              currentUser={currentUser}
              onClose={() => {setShowTxModal(false); setEditingTx(null)}} 
              onSave={handleSaveTx}
              onDelete={handleDeleteTx}
            />
          )}

          {showBudgetModal && (
            <BudgetModal 
              currentBudget={budget} 
              onClose={() => setShowBudgetModal(false)} 
              onSave={(b) => {setBudget(b); setShowBudgetModal(false)}} 
            />
          )}

          {showGoalModal && (
            <GoalModal
              goal={editingGoal}
              onClose={() => {setShowGoalModal(false); setEditingGoal(null)}}
              onSave={(g) => {
                const newGoals = [...goals];
                const idx = newGoals.findIndex(x => x.id === g.id);
                if(idx >= 0) newGoals[idx] = g; else newGoals.push(g);
                setGoals(newGoals);
                setShowGoalModal(false);
              }}
              onDelete={(id) => {
                setGoals(goals.filter(x => x.id !== id));
                setShowGoalModal(false);
              }}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      // Basic SW registration placeholder for PWA
      navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW Registration skipped/failed:', e));
    }
  </script>
</body>
</html>
